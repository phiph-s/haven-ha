name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag und manifest.json vergleichen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import json; print(json.load(open('custom_components/haven/manifest.json'))['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Der Tag v$tag passt nicht zur Version $version in custom_components/haven/manifest.json. Version anpassen oder Tag neu setzen."
            exit 1
          fi

      - name: haven.zip bauen
        run: |
          cd custom_components/haven
          zip -r ../../haven.zip . -x "__pycache__/*" "*.pyc"

      - name: Release-Text aus der Tag-Nachricht
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d' > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: haven.zip
          # Text aus dem annotierten Tag, ohne Text die Liste der Commits
          body_path: ${{ env.NOTES_FILE }}
          generate_release_notes: ${{ env.NOTES_FILE == '' }}
